name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  package:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: package-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build the deployable tarball (includes build.json with this commit)
        run: backend/scripts/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: dist/*
      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            gh release create "$REF_NAME" dist/* --title "$REF_NAME" --generate-notes
          else
            # One rolling prerelease that always holds the newest main build, at a stable URL:
            # releases/download/main-latest/backend.tar.gz
            gh release delete main-latest --cleanup-tag --yes || true
            gh release create main-latest dist/* --prerelease --target "$SHA" \
              --title "main (${SHA::7})" --notes "Automated build of $SHA. Tests passed."
          fi
